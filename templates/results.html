<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xflutter — Results</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ── */
.header { background: #161b22; border-bottom: 1px solid #30363d; padding: 11px 18px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; z-index: 300; position: relative; }
.header h1 { font-size: 1rem; font-weight: 700; color: #58a6ff; }
.dart-badge { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb55; border-radius: 20px; padding: 2px 9px; font-size: 0.76rem; font-family: monospace; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.header-links { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.header-links a { color: #8b949e; text-decoration: none; font-size: 0.8rem; border: 1px solid #30363d; padding: 4px 10px; border-radius: 6px; white-space: nowrap; transition: all 0.15s; }
.header-links a:hover { color: #58a6ff; border-color: #58a6ff; }

/* ── Hamburger (mobile only) ── */
.hamburger { display: none; background: none; border: none; cursor: pointer; color: #8b949e; font-size: 1.3rem; padding: 4px 6px; border-radius: 6px; line-height: 1; flex-shrink: 0; }
.hamburger:hover { color: #c9d1d9; background: #21262d; }

/* ── Sidebar overlay backdrop ── */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 49px); }

/* ── Sidebar ── */
.sidebar { width: 210px; background: #161b22; border-right: 1px solid #30363d; padding: 10px 0; flex-shrink: 0; overflow-y: auto; transition: transform 0.25s ease; }
.nav-sec { padding: 8px 14px 3px; font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; }
.nav-item { display: flex; align-items: center; gap: 7px; padding: 8px 14px; cursor: pointer; font-size: 0.84rem; color: #8b949e; border-left: 2px solid transparent; transition: all 0.12s; user-select: none; }
.nav-item:hover { color: #c9d1d9; background: #21262d; }
.nav-item.active { color: #58a6ff; border-left-color: #58a6ff; background: #1f6feb0d; }
.nav-badge { margin-left: auto; background: #21262d; color: #8b949e; border-radius: 10px; padding: 1px 6px; font-size: 0.71rem; min-width: 20px; text-align: center; }
.nav-item.active .nav-badge { background: #1f6feb22; color: #58a6ff; }

/* ── Main content ── */
.main { flex: 1; overflow-y: auto; padding: 20px 24px; }
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── Shared components ── */
h2 { font-size: 1.1rem; color: #e6edf3; margin-bottom: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-bottom: 18px; }
.info-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; }
.info-card .lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.info-card .val { font-size: 1rem; font-weight: 700; color: #e6edf3; }
.info-card .sub { font-size: 0.75rem; color: #58a6ff; margin-top: 2px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.stat-pill { background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 4px 12px; font-size: 0.79rem; color: #8b949e; }
.stat-pill b { color: #58a6ff; }
.search-bar { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 7px; padding: 7px 12px; color: #c9d1d9; font-size: 0.87rem; margin-bottom: 12px; outline: none; }
.search-bar:focus { border-color: #58a6ff; }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.83rem; min-width: 320px; }
.tbl th { text-align: left; padding: 7px 10px; background: #161b22; color: #8b949e; font-weight: 600; font-size: 0.73rem; text-transform: uppercase; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 1; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid #21262d; color: #c9d1d9; word-break: break-all; vertical-align: top; }
.tbl tr:hover td { background: #161b22; }

/* ── Tags ── */
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 0.71rem; font-weight: 600; white-space: nowrap; }
.t-url  { background: #1f6feb18; color: #58a6ff; border: 1px solid #1f6feb44; }
.t-key  { background: #f8514918; color: #f85149; border: 1px solid #f8514944; }
.t-email{ background: #3fb95018; color: #3fb950; border: 1px solid #3fb95044; }
.t-jwt  { background: #d2992218; color: #d29922; border: 1px solid #d2992244; }
.t-pkg  { background: #bc8cff18; color: #bc8cff; border: 1px solid #bc8cff44; }
.t-ip   { background: #ff7b7218; color: #ff7b72; border: 1px solid #ff7b7244; }
.t-fb   { background: #f0883e18; color: #f0883e; border: 1px solid #f0883e44; }

/* ── Code blocks ── */
.code-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.code-head { background: #21262d; padding: 7px 12px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; font-size: 0.79rem; color: #8b949e; flex-wrap: wrap; }
.code-head .dl-btn, .code-head .copy-btn { background: #30363d; border: none; color: #8b949e; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 0.74rem; text-decoration: none; display: inline-block; }
.code-head .dl-btn:hover, .code-head .copy-btn:hover { color: #c9d1d9; background: #484f58; }
.code-head .dl-btn + .dl-btn, .code-head .dl-btn + .copy-btn { margin-left: 4px; }
.code-body { padding: 14px; overflow: auto; max-height: 480px; -webkit-overflow-scrolling: touch; }
.code-body pre { font-family: 'Courier New', monospace; font-size: 0.78rem; line-height: 1.6; color: #c9d1d9; white-space: pre; }

/* ── Classes ── */
.cls-item { background: #161b22; border: 1px solid #30363d; border-radius: 7px; margin-bottom: 6px; overflow: hidden; }
.cls-head { padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; min-width: 0; }
.cls-head:hover { background: #21262d; }
.cls-pkg { font-size: 0.7rem; color: #bc8cff; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; flex-shrink: 0; }
.cls-name { font-family: 'Courier New', monospace; font-weight: 600; color: #79c0ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.cls-cnt { color: #8b949e; font-size: 0.76rem; white-space: nowrap; flex-shrink: 0; }
.cls-chev { color: #484f58; font-size: 0.8rem; transition: transform 0.15s; flex-shrink: 0; }
.cls-body { display: none; padding: 8px 12px 10px; border-top: 1px solid #30363d; }
.cls-body.open { display: block; }
.cls-chev.open { transform: rotate(180deg); }
.method-list { display: flex; flex-wrap: wrap; gap: 5px; }
.method-pill { background: #21262d; border-radius: 4px; padding: 2px 8px; font-size: 0.74rem; font-family: 'Courier New', monospace; color: #c9d1d9; border: 1px solid #30363d; }

/* ── Assembly ── */
.asm-layout { display: grid; grid-template-columns: 240px 1fr; gap: 12px; height: calc(100vh - 130px); }
.asm-tree { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.asm-search { padding: 8px; border-bottom: 1px solid #30363d; background: #161b22; }
.asm-search input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; padding: 5px 8px; color: #c9d1d9; font-size: 0.79rem; outline: none; }
.asm-search input:focus { border-color: #58a6ff; }
.asm-scroll { overflow-y: auto; flex: 1; }
.asm-pkg-label { padding: 6px 10px 3px; font-size: 0.69rem; color: #bc8cff; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #30363d; background: #1a1f27; position: sticky; top: 0; z-index: 1; }
.asm-file-item { padding: 5px 10px 5px 18px; cursor: pointer; font-size: 0.77rem; font-family: monospace; color: #8b949e; border-bottom: 1px solid #21262d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asm-file-item:hover { background: #21262d; color: #c9d1d9; }
.asm-file-item.active { background: #1f6feb18; color: #58a6ff; }
.asm-viewer { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; overflow: auto; -webkit-overflow-scrolling: touch; }
.asm-viewer pre { padding: 14px; font-family: 'Courier New', monospace; font-size: 0.78rem; line-height: 1.65; color: #c9d1d9; white-space: pre; }
.asm-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 0.88rem; padding: 24px; text-align: center; }

/* ── Misc ── */
.empty { text-align: center; padding: 48px 24px; color: #484f58; }
.empty .icon { font-size: 2.2rem; margin-bottom: 10px; }
.alert { border-radius: 7px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.84rem; line-height: 1.5; }
.alert-warn { background: #d2992211; border: 1px solid #d2992244; color: #d29922; }
.alert-ok   { background: #3fb95011; border: 1px solid #3fb95044; color: #3fb950; }
.alert-err  { background: #f8514911; border: 1px solid #f8514944; color: #f85149; }
.flag-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 16px; }
.flag { background: #1f6feb18; color: #58a6ff; border: 1px solid #1f6feb44; border-radius: 4px; padding: 2px 9px; font-size: 0.77rem; font-family: monospace; }
.sec-title { font-size: 0.79rem; font-weight: 700; color: #484f58; text-transform: uppercase; letter-spacing: 0.07em; margin: 20px 0 8px; }
.log-box { background: #0d1117; border: 1px solid #30363d; border-radius: 7px; padding: 12px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.77rem; line-height: 1.6; }
.log-ok   { color: #3fb950; }
.log-warn { color: #d29922; }
.log-err  { color: #f85149; }
.log-info { color: #8b949e; }
.pg-bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pg-btn { background: #21262d; border: 1px solid #30363d; border-radius: 5px; padding: 6px 14px; color: #8b949e; cursor: pointer; font-size: 0.82rem; }
.pg-btn:hover:not(:disabled) { color: #c9d1d9; border-color: #58a6ff; }
.pg-btn:disabled { opacity: 0.4; cursor: default; }
.pg-info { color: #8b949e; font-size: 0.8rem; flex: 1; text-align: center; }
.url-link { color: #58a6ff; word-break: break-all; }
.url-link:hover { text-decoration: underline; }

/* ══════════════════════════════════════════════
   RESPONSIVE — iPad/Tablet  769px – 1024px
══════════════════════════════════════════════ */
@media (max-width: 1024px) {
  .sidebar { width: 185px; }
  .nav-item { font-size: 0.81rem; padding: 7px 12px; gap: 6px; }
  .main { padding: 16px 18px; }
  .asm-layout { grid-template-columns: 195px 1fr; }
  .dart-badge { max-width: 160px; }
}

/* ══════════════════════════════════════════════
   RESPONSIVE — Mobile  ≤768px
══════════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Header */
  .header { padding: 10px 14px; gap: 6px; }
  .header h1 { font-size: 0.95rem; }
  .dart-badge { display: none; }
  .header-links a { font-size: 0.74rem; padding: 4px 8px; }
  .hamburger { display: flex; align-items: center; order: -1; }

  /* Sidebar — slide-in overlay drawer */
  .layout { position: relative; overflow: hidden; }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 200;
    width: 260px;
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    padding-top: 52px;
    border-right: 1px solid #30363d;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }

  /* Main */
  .main { padding: 14px 15px; }
  h2 { font-size: 1rem; }

  /* Info grid — 2 cols on mobile */
  .info-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .info-card { padding: 10px 12px; }
  .info-card .val { font-size: 0.95rem; }

  /* Tables — horizontal scroll */
  .tbl-wrap { margin: 0 -15px; padding: 0 15px; }

  /* Classes — hide package on very small screens */
  .cls-pkg { display: none; }

  /* Assembly — stack vertically */
  .asm-layout { grid-template-columns: 1fr; height: auto; gap: 10px; }
  .asm-tree { height: 200px; }
  .asm-viewer { min-height: 260px; max-height: 50vh; }

  /* Code blocks */
  .code-body { max-height: 320px; }
  .code-body pre { font-size: 0.73rem; }

  /* Pagination */
  .pg-bar { gap: 6px; }
  .pg-btn { padding: 6px 10px; font-size: 0.78rem; }

  /* Stat pills — smaller */
  .stat-pill { font-size: 0.75rem; padding: 3px 10px; }
}

/* ══════════════════════════════════════════════
   RESPONSIVE — Small phone  ≤480px
══════════════════════════════════════════════ */
@media (max-width: 480px) {
  .header-links a:not(:last-child) { display: none; }
  .info-grid { grid-template-columns: 1fr 1fr; }
  .cls-pkg { display: none; }
  .main { padding: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <div>⚡</div>
  <h1>Xflutter</h1>
  <span class="dart-badge" id="dart-ver-badge">loading...</span>
  <div class="header-links">
    <a href="/history">🕘 Riwayat</a>
    <a href="/">← Analisis Baru</a>
  </div>
</div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="nav-sec">Overview</div>
    <div class="nav-item active" data-panel="overview" onclick="showPanel('overview',this)">📋 Ringkasan</div>

    <div class="nav-sec">Temuan</div>
    <div class="nav-item" data-panel="secrets" onclick="showPanel('secrets',this)">🔑 Secrets &amp; Keys <span class="nav-badge" id="b-secrets">-</span></div>
    <div class="nav-item" data-panel="urls" onclick="showPanel('urls',this)">🌐 URLs <span class="nav-badge" id="b-urls">-</span></div>
    <div class="nav-item" data-panel="strings" onclick="showPanel('strings',this)">💬 Strings <span class="nav-badge" id="b-strings">-</span></div>
    <div class="nav-item" data-panel="packages" onclick="showPanel('packages',this)">📦 Dart Packages <span class="nav-badge" id="b-pkgs">-</span></div>

    <div class="nav-sec">Decompiled</div>
    <div class="nav-item" data-panel="classes" onclick="showPanel('classes',this)">🏗️ Classes <span class="nav-badge" id="b-cls">-</span></div>
    <div class="nav-item" data-panel="asm" onclick="showPanel('asm',this)">⚙️ Assembly</div>

    <div class="nav-sec">Scripts</div>
    <div class="nav-item" data-panel="frida" onclick="showPanel('frida',this)">🪝 Frida Script</div>
    <div class="nav-item" data-panel="r2" onclick="showPanel('r2',this)">📡 Radare2 Script</div>
  </div>

  <div class="main" id="main">
    <div id="panel-overview" class="panel active">
      <div style="color:#8b949e;padding:24px 0">⏳ Memuat data hasil analisis...</div>
    </div>
  </div>
</div>

<script>
const JOB_ID = {{ job.id | tojson }};
let DATA = null;

// ── Sidebar toggle (mobile) ───────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const open = sidebar.classList.toggle('open');
  overlay.classList.toggle('open', open);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('/results/' + JOB_ID + '/data');
    DATA = await r.json();
    buildAllPanels();
  } catch(e) {
    document.getElementById('panel-overview').innerHTML =
      `<div class="alert alert-err">❌ Gagal memuat data: ${e.message}</div>`;
  }
}

// ── Panel switching ───────────────────────────────────────────────────────────
function showPanel(name, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
  if (name === 'asm' && !asmLoaded) loadAsmPanel();
  if (name === 'strings' && !stringsLoaded) loadStringsPanel(0);
  // Auto-close sidebar on mobile after selection
  if (window.innerWidth <= 768) closeSidebar();
}

function getOrMakePanel(id) {
  let p = document.getElementById('panel-' + id);
  if (!p) {
    p = document.createElement('div');
    p.id = 'panel-' + id;
    p.className = 'panel';
    document.getElementById('main').appendChild(p);
  }
  return p;
}

// ── Build all panels ──────────────────────────────────────────────────────────
function buildAllPanels() {
  const d = DATA.dart_info || {};
  const s = DATA.scan || {};
  const b = DATA.blutter || {};

  if (d.version) {
    document.getElementById('dart-ver-badge').textContent =
      `Dart ${d.version} · ${d.arch||''} ${d.os||''}`;
  }

  const secrets = [...(s.google_keys||[]), ...(s.aws_keys||[]), ...(s.jwt_tokens||[]),
                   ...(s.api_keys||[]), ...(s.private_keys||[])];
  setB('b-secrets', secrets.length, secrets.length > 0 ? '#f85149' : null);
  setB('b-urls', (s.urls||[]).length);
  setB('b-strings', s.string_count || (b.string_literals||[]).length);
  setB('b-pkgs', (s.dart_packages||[]).length);
  setB('b-cls', (b.classes||[]).length);

  buildOverview(d, s, b, secrets);
  buildSecrets(s);
  buildUrls(s);
  buildPackages(s);
  buildClasses(b);
  buildFrida(b);
  buildR2(b);
}

function setB(id, val, color) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = val;
  if (color) el.style.color = color;
}

// ── Overview ──────────────────────────────────────────────────────────────────
function buildOverview(d, s, b, secrets) {
  const p = getOrMakePanel('overview');
  const status = DATA.status;
  const alertHtml =
    status === 'done'    ? `<div class="alert alert-ok">✅ Analisis lengkap — static scan + decompilasi Blutter berhasil.</div>` :
    status === 'partial' ? `<div class="alert alert-warn">⚠️ Blutter gagal dijalankan — menampilkan hasil static scan saja. Pastikan cmake/ninja/gcc tersedia.</div>` :
    status === 'error'   ? `<div class="alert alert-err">❌ Terjadi kesalahan: ${esc(DATA.log?.slice(-1)[0]||'')}</div>` : '';

  const flags = (d.flags||[]).map(f => `<span class="flag">${esc(f)}</span>`).join('') || '<span style="color:#484f58">-</span>';
  const strl = b.stats?.total_strings || s.string_count || 0;

  p.innerHTML = alertHtml + `
    <h2>📋 Ringkasan Analisis</h2>
    <div class="info-grid">
      <div class="info-card"><div class="lbl">Dart Version</div><div class="val">${esc(d.version||'N/A')}</div></div>
      <div class="info-card"><div class="lbl">Arsitektur</div><div class="val">${esc(d.arch||'N/A')}</div><div class="sub">${esc(d.os||'')}</div></div>
      <div class="info-card"><div class="lbl">Snapshot Hash</div><div class="val" style="font-size:0.7rem;font-family:monospace;word-break:break-all">${esc((d.snapshot_hash||'N/A').slice(0,16))}…</div></div>
      <div class="info-card"><div class="lbl">Classes</div><div class="val">${(b.classes||[]).length||'-'}</div></div>
      <div class="info-card"><div class="lbl">Functions</div><div class="val">${b.stats?.total_functions||'-'}</div></div>
      <div class="info-card"><div class="lbl">Secrets</div><div class="val" style="color:${secrets.length?'#f85149':'#3fb950'}">${secrets.length}</div><div class="sub">${secrets.length?'⚠️ Perlu diperiksa!':'✅ Tidak ada'}</div></div>
    </div>
    <div class="sec-title">VM Flags</div>
    <div class="flag-row">${flags}</div>
    <div class="sec-title">Statistik</div>
    <div class="stat-row">
      <div class="stat-pill">URLs: <b>${(s.urls||[]).length}</b></div>
      <div class="stat-pill">Emails: <b>${(s.emails||[]).length}</b></div>
      <div class="stat-pill">IPs: <b>${(s.ips||[]).length}</b></div>
      <div class="stat-pill">Firebase: <b>${(s.firebase_urls||[]).length}</b></div>
      <div class="stat-pill">Dart packages: <b>${(s.dart_packages||[]).length}</b></div>
      <div class="stat-pill">Total strings: <b>${strl}</b></div>
    </div>
    <div class="sec-title">Log Analisis</div>

// ── Strings (paginated, lazy-loaded) ─────────────────────────────────────────
let stringsLoaded = false;
let strPage = 0;
let strTotal = 0;
let strPages = 0;
let strQuery = '';

function buildStringsShell() {
  const p = getOrMakePanel('strings');
  const b = DATA.blutter || {};
  const s = DATA.scan || {};
  const interesting = [...(s.interesting_strings||[])];
  const literals = [...(b.string_literals||[])];
  const combined = [...new Set([...interesting, ...literals])].sort();

  p.innerHTML = `<h2>💬 Strings</h2>
    <div class="stat-row" style="margin-bottom:10px">
      <div class="stat-pill">Interesting: <b>${interesting.length}</b></div>
      <div class="stat-pill">Literal ASM: <b>${literals.length}</b></div>
      <div class="stat-pill">Total binary: <b>${s.string_count||0}</b></div>
    </div>
    ${combined.length > 0 ? `
    <div class="sec-title">Interesting &amp; Literal Strings (${combined.length})</div>
    <input class="search-bar" placeholder="Cari..." oninput="filterTbl(this,'tbl-combined')">
    <div class="tbl-wrap"><table class="tbl" id="tbl-combined" style="margin-bottom:24px">
      <thead><tr><th>#</th><th>String</th></tr></thead>
      <tbody>${combined.slice(0,2000).map((s,i)=>`<tr>
        <td style="color:#484f58;width:36px">${i+1}</td>
        <td><code style="font-size:0.77rem">${esc(s)}</code></td>
      </tr>`).join('')}</tbody>
    </table></div>` : ''}
    <div class="sec-title">Semua Strings di Binary (paginasi)</div>
    <input class="search-bar" placeholder="Cari semua strings..." id="all-str-search" oninput="onStrSearch(this.value)">
    <div id="all-str-container"><div style="color:#8b949e;padding:8px 0">Memuat...</div></div>
    <div class="pg-bar" id="pg-bar" style="display:none">
      <button class="pg-btn" id="pg-prev" onclick="loadStringsPanel(strPage-1)">← Sebelumnya</button>
      <span class="pg-info" id="pg-info"></span>
      <button class="pg-btn" id="pg-next" onclick="loadStringsPanel(strPage+1)">Berikutnya →</button>
    </div>`;
}

async function loadStringsPanel(page) {
  if (!stringsLoaded) { buildStringsShell(); stringsLoaded = true; }
  const q = strQuery ? '&q=' + encodeURIComponent(strQuery) : '';
  const r = await fetch(`/results/${JOB_ID}/strings?page=${page}${q}`);
  const data = await r.json();
  strPage = data.page; strTotal = data.total; strPages = data.pages;

  const container = document.getElementById('all-str-container');
  if (!container) return;
  if (data.strings.length === 0) {
    container.innerHTML = '<div class="empty" style="padding:24px"><div class="icon">💬</div>Tidak ada string ditemukan</div>';
    document.getElementById('pg-bar').style.display = 'none';
    return;
  }
  container.innerHTML = `<div class="tbl-wrap"><table class="tbl" id="tbl-all-str">
    <thead><tr><th>#</th><th>String</th></tr></thead>
    <tbody>${data.strings.map((s,i)=>`<tr>
      <td style="color:#484f58;width:42px">${page*300+i+1}</td>
      <td><code style="font-size:0.77rem">${esc(s)}</code></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
  const pgBar = document.getElementById('pg-bar');
  pgBar.style.display = 'flex';
  document.getElementById('pg-info').textContent = `Hal. ${page+1} / ${strPages} (${strTotal} total)`;
  document.getElementById('pg-prev').disabled = page === 0;
  document.getElementById('pg-next').disabled = page >= strPages - 1;
}

let strSearchTimer;
function onStrSearch(val) {
  strQuery = val;
  clearTimeout(strSearchTimer);
  strSearchTimer = setTimeout(() => loadStringsPanel(0), 400);
}

// ── Classes ───────────────────────────────────────────────────────────────────
function buildClasses(b) {
  const p = getOrMakePanel('classes');
  const classes = b.classes || [];
  if (classes.length === 0) {
    p.innerHTML = `<h2>🏗️ Classes</h2><div class="empty"><div class="icon">🏗️</div>Data classes tidak tersedia (butuh decompilasi Blutter)</div>`;
    return;
  }
  const items = classes.map((c,i) => `
    <div class="cls-item">
      <div class="cls-head" onclick="toggleCls(${i})">
        <span class="cls-pkg">${esc(c.package||'')}</span>
        <span style="color:#484f58;flex-shrink:0">/</span>
        <span class="cls-name">${esc(c.name)}</span>
        <span class="cls-cnt">${c.method_count} fn</span>
        <span class="cls-chev" id="chev-${i}">▼</span>
      </div>
      <div class="cls-body" id="cls-body-${i}">
        <div class="method-list">${c.methods.map(m=>`<span class="method-pill">${esc(m)}</span>`).join('')}</div>
      </div>
    </div>`).join('');
  p.innerHTML = `<h2>🏗️ Classes — ${classes.length}</h2>
    <input class="search-bar" placeholder="Cari class..." oninput="filterClasses(this)">
    <div id="cls-list">${items}</div>`;
}

function toggleCls(i) {
  document.getElementById('cls-body-'+i).classList.toggle('open');
  document.getElementById('chev-'+i).classList.toggle('open');
}

// ── Assembly ──────────────────────────────────────────────────────────────────
let asmLoaded = false;
let asmTree = [];
let currentAsmKey = null;

async function loadAsmPanel() {
  asmLoaded = true;
  const p = getOrMakePanel('asm');
  p.classList.add('active');
  p.innerHTML = `<h2>⚙️ Assembly Viewer</h2><div style="color:#8b949e">Memuat daftar file...</div>`;

  const r = await fetch('/results/' + JOB_ID + '/asm');
  asmTree = await r.json();

  if (asmTree.length === 0) {
    p.innerHTML = `<h2>⚙️ Assembly Viewer</h2>
      <div class="empty"><div class="icon">⚙️</div>File assembly tidak tersedia (butuh decompilasi Blutter)</div>`;
    return;
  }

  const byPkg = {};
  asmTree.forEach(item => {
    if (!byPkg[item.package]) byPkg[item.package] = [];
    byPkg[item.package].push(item);
  });

  const treeHtml = Object.entries(byPkg).map(([pkg, files]) => `
    <div class="asm-pkg-label">${esc(pkg)}</div>
    ${files.map(f => `<div class="asm-file-item" data-key="${esc(f.key)}" onclick="loadAsmFile('${esc(f.key)}')">${esc(f.file)}</div>`).join('')}
  `).join('');

  p.innerHTML = `<h2>⚙️ Assembly Viewer — ${asmTree.length} files</h2>
    <div class="asm-layout">
      <div class="asm-tree">
        <div class="asm-search"><input placeholder="Cari file..." oninput="filterAsmTree(this.value)"></div>
        <div class="asm-scroll" id="asm-scroll">${treeHtml}</div>
      </div>
      <div class="asm-viewer" id="asm-viewer">
        <div class="asm-placeholder">← Pilih file untuk melihat assembly</div>
      </div>
    </div>`;
}

async function loadAsmFile(key) {
  currentAsmKey = key;
  document.querySelectorAll('.asm-file-item').forEach(el => {
    el.classList.toggle('active', el.dataset.key === key);
  });
  const viewer = document.getElementById('asm-viewer');
  viewer.innerHTML = '<div style="padding:14px;color:#58a6ff">Memuat...</div>';
  const r = await fetch('/results/' + JOB_ID + '/asm/' + key);
  if (!r.ok) { viewer.innerHTML = `<div style="padding:14px;color:#f85149">Gagal memuat: ${r.status}</div>`; return; }
  const text = await r.text();
  viewer.innerHTML = `<pre>${esc(text)}</pre>`;
  // On mobile, scroll to viewer
  if (window.innerWidth <= 768) viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function filterAsmTree(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.asm-file-item').forEach(el => {
    el.style.display = el.dataset.key.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.asm-pkg-label').forEach(lbl => {
    let next = lbl.nextElementSibling;
    let hasVisible = false;
    while (next && !next.classList.contains('asm-pkg-label')) {
      if (next.style.display !== 'none') hasVisible = true;
      next = next.nextElementSibling;
    }
    lbl.style.display = hasVisible ? '' : 'none';
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function filterTbl(input, id) {
  const q = input.value.toLowerCase();
  document.querySelectorAll('#' + id + ' tbody tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function filterClasses(input) {
  const q = input.value.toLowerCase();
  document.querySelectorAll('#cls-list .cls-item').forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function copyEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadData();
